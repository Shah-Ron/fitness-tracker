name: Android app

on:
  push:
    branches: [main]
    paths: ["phone/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          MGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$MGR" --licenses > /dev/null 2>&1 || true
          "$MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Put the app into the package
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r phone/. android/app/src/main/assets/
          rm -f android/app/src/main/assets/sw.js android/app/src/main/assets/sw.src.js

      - name: Signing key
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Fitness-Tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fitness-Tracker.apk
          path: Fitness-Tracker.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Fitness Tracker ${{ env.VERSION_NAME }}
          body: |
            Download **Fitness-Tracker.apk** on your phone and open it to install. If Android asks, allow installs from your browser for this one file.
            Updates install over the top and keep your data.
          files: Fitness-Tracker.apk
