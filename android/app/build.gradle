plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")

android {
    namespace "io.github.shahron.fitness"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.shahron.fitness"
        minSdk 29
        targetSdk 34
        versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName (System.getenv("VERSION_NAME") ?: "1.0")
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the release key when the workflow has one, else the runner's debug key.
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.webkit:webkit:1.11.0"
}
