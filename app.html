<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3E6B48">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Fitness Tracker</title>
<style>
/* ------------------------------------------------------------------
   Colour. A warm plaster page, ink the colour of wet slate, and a deep
   English green for the app itself. Two chart hues only: a lake blue for
   food eaten and a terracotta for calories burned and effort. Blue and
   terracotta stay apart for every common kind of colour blindness. The
   green is only ever drawn on its own.
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --plane: #F2F1EC; --panel: #FFFFFF; --panel-2: #F6F5F0; --panel-3: #ECEBE4;
  --ink: #1E2A26; --ink-2: #47554F; --muted: #6B776F;
  --line: rgba(30,42,38,.12); --grid: #E3E4DD; --axis: #C9CDC4;
  --accent: #3E6B48; --accent-ink: #33603F; --accent-tint: rgba(62,107,72,.12); --on-accent: #FFFFFF;
  --fuel: #35639C; --fuel-ink: #2F589A; --fuel-tint: rgba(53,99,156,.12);
  --burn: #C06A2C; --burn-ink: #9E5620; --burn-tint: rgba(192,106,44,.13);
  --good: #3E6B48; --good-tint: rgba(62,107,72,.13);
  --warn: #8A5A12; --warn-tint: rgba(197,160,70,.22);
  --crit: #A33A24; --crit-tint: rgba(163,58,36,.11);
  --grey: #8C948E;
  --shadow: 0 4px 12px rgba(30,42,38,.06); --lift: 0 12px 26px rgba(30,42,38,.12);
  --display: Bahnschrift, "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.25,.8,.25,1);
  --tap: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #171C1A; --panel: #212826; --panel-2: #2A332F; --panel-3: #333D38;
    --ink: #ECEFEA; --ink-2: #BCC5BF; --muted: #8F9B94;
    --line: rgba(255,255,255,.10); --grid: #313A36; --axis: #414C46;
    --accent: #86BE94; --accent-ink: #A3D4AF; --accent-tint: rgba(134,190,148,.16); --on-accent: #10201A;
    --fuel: #7AA3E0; --fuel-ink: #9DBDEE; --fuel-tint: rgba(122,163,224,.18);
    --burn: #D48A4A; --burn-ink: #E5A672; --burn-tint: rgba(212,138,74,.18);
    --good: #86BE94; --good-tint: rgba(134,190,148,.14);
    --warn: #E0B45B; --warn-tint: rgba(224,180,91,.16);
    --crit: #E98A73; --crit-tint: rgba(233,138,115,.14);
    --grey: #6F7A74;
    --shadow: 0 4px 14px rgba(0,0,0,.35); --lift: 0 12px 26px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #171C1A; --panel: #212826; --panel-2: #2A332F; --panel-3: #333D38;
  --ink: #ECEFEA; --ink-2: #BCC5BF; --muted: #8F9B94;
  --line: rgba(255,255,255,.10); --grid: #313A36; --axis: #414C46;
  --accent: #86BE94; --accent-ink: #A3D4AF; --accent-tint: rgba(134,190,148,.16); --on-accent: #10201A;
  --fuel: #7AA3E0; --fuel-ink: #9DBDEE; --fuel-tint: rgba(122,163,224,.18);
  --burn: #D48A4A; --burn-ink: #E5A672; --burn-tint: rgba(212,138,74,.18);
  --good: #86BE94; --good-tint: rgba(134,190,148,.14);
  --warn: #E0B45B; --warn-tint: rgba(224,180,91,.16);
  --crit: #E98A73; --crit-tint: rgba(233,138,115,.14);
  --grey: #6F7A74;
  --shadow: 0 4px 14px rgba(0,0,0,.35); --lift: 0 12px 26px rgba(0,0,0,.5);
}

/* ------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
body { background: var(--plane); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background-color .3s ease, color .3s ease; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 90px; }
h1, h2, h3, .num, .display { font-family: var(--display); letter-spacing: 0; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
p { margin: 0; }
.hint { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.good-ink { color: var(--good); } .crit-ink { color: var(--crit); } .fuel-ink { color: var(--fuel-ink); } .burn-ink { color: var(--burn-ink); } .accent-ink { color: var(--accent-ink); }
[hidden] { display: none !important; }
a { color: var(--accent-ink); }
code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; background: var(--panel-2); padding: 1px 6px; border-radius: 6px; word-break: break-all; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.spacer { flex: 1 1 auto; }
.mt { margin-top: 12px; } .mt2 { margin-top: 20px; } .mb { margin-bottom: 12px; }

button, .btn { font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 15px; min-height: 40px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s ease, border-color .15s ease, transform .15s var(--ease), box-shadow .2s ease, color .15s; }
button:hover, .btn:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; font-family: var(--display); }
button.primary:hover { filter: brightness(1.06); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--ink); background: var(--panel-2); border-color: transparent; }
button.link { background: none; border: 0; padding: 4px 6px; min-height: 0; color: var(--accent-ink); font-weight: 600; }
button.link:hover { text-decoration: underline; }
button.good { background: var(--good-tint); border-color: transparent; color: var(--good); font-weight: 600; }
button.warn { background: var(--warn-tint); border-color: transparent; color: var(--warn); font-weight: 600; }
button.danger { background: var(--crit-tint); border-color: transparent; color: var(--crit); font-weight: 600; }
button.big { min-height: var(--tap); padding: 10px 20px; font-size: 15px; border-radius: 14px; }
button.wide { width: 100%; }
button[disabled] { opacity: .45; cursor: default; pointer-events: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type="number"], input[type="date"], input[type="text"], input[type="search"], input[type="time"], input[type="email"], select, textarea { font: inherit; font-size: 15px; padding: 10px 12px; width: 100%; min-height: 44px; border: 1px solid var(--axis); border-radius: 12px; background: var(--panel); color: var(--ink); transition: border-color .15s ease; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="number"] { font-variant-numeric: tabular-nums; }
label.field { display: block; }
label.field > span:first-child, .cap { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
.f-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 14px; }
.f-row .grow { flex: 1 1 200px; }
.f-row .narrow { flex: 0 1 160px; }
@media (max-width: 640px) { .f-row > * { flex: 1 1 100% !important; } }

/* ------------------------------------------------------------ header and nav */
header.top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 20px; height: 20px; stroke: var(--on-accent); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.brand h1 { font-size: 20px; font-weight: 600; margin: 0; }
.notice { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-tint); color: var(--ink-2); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.notice.warn { background: var(--warn-tint); }
.notice.crit { background: var(--crit-tint); color: var(--crit); }
.notice .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.notice.warn .dot { background: var(--warn); } .notice.crit .dot { background: var(--crit); }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; color: var(--muted); }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .slider { position: relative; width: 46px; height: 26px; border-radius: 999px; background: var(--axis); transition: background .3s; flex: none; }
.switch .slider::before { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .3s var(--ease); }
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); }
.switch svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

nav.tiles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px; }
.tile { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; font-family: var(--display); font-weight: 600; font-size: 15px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .3s var(--ease), border-radius .3s var(--ease), box-shadow .3s ease, border-color .3s ease, background .3s ease, color .3s ease; }
.tile:hover { transform: translateY(-3px); border-color: var(--accent); border-radius: 12px; box-shadow: var(--lift); }
.tile[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); border-radius: 12px; }
.tile .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--burn-tint); color: var(--burn-ink); font-variant-numeric: tabular-nums; }
.tile[aria-selected="true"] .badge { background: rgba(255,255,255,.22); color: inherit; }

.bottombar { display: none; }
@media (max-width: 640px) {
  nav.tiles { display: none; }
  .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
  .bottombar button { border: 0; background: transparent; min-height: 52px; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--display); }
  .bottombar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bottombar button.on { color: var(--accent-ink); background: var(--accent-tint); }
  header.top { margin-bottom: 14px; }
}

/* ------------------------------------------------------------ surfaces */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.card + .card, .grid + .card, .card + .grid, .grid + .grid, .hero + .card, .hero + .grid { margin-top: 14px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 880px) { .g2, .g3 { grid-template-columns: 1fr; } .g4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .g4 { grid-template-columns: 1fr 1fr; } }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.stat .l { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat .v { font-family: var(--display); font-size: 26px; font-weight: 600; line-height: 1.15; margin-top: 2px; }
.stat .f { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-tint); color: var(--good); } .pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.crit { background: var(--crit-tint); color: var(--crit); } .pill.fuel { background: var(--fuel-tint); color: var(--fuel-ink); }
.pill.burn { background: var(--burn-tint); color: var(--burn-ink); } .pill.accent { background: var(--accent-tint); color: var(--accent-ink); }
.meter { height: 8px; background: var(--panel-3); border-radius: 999px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s var(--ease); }
.meter.fuel > span { background: var(--fuel); } .meter.burn > span { background: var(--burn); } .meter.over > span { background: var(--crit); }
.callout { border-left: 3px solid var(--accent); background: var(--panel-2); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 14px; color: var(--ink-2); margin-top: 12px; }
.callout.warn { border-left-color: var(--warn); } .callout.crit { border-left-color: var(--crit); }
.callout strong { color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 26px 16px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; padding: 6px 10px; border-bottom: 1px solid var(--grid); }
td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--panel-2); }
.tablewrap { overflow-x: auto; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; cursor: pointer; transition: all .2s var(--ease); color: var(--ink); }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); border-radius: 10px; }
.chip.on.fuel { background: var(--fuel); border-color: var(--fuel); color: #fff; }
.chip small { opacity: .75; font-size: 12px; }
.lg-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--grid); border-radius: 8px; transition: background .15s; }
.lg-row:hover { background: var(--panel-2); } .lg-row:last-child { border-bottom: none; }
.lg-row.click { cursor: pointer; }
.lg-what { min-width: 0; } .lg-what .t { font-weight: 600; } .lg-what .c { color: var(--muted); font-size: 12.5px; }
.lg-amt { text-align: right; font-family: var(--display); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.lg-amt small { display: block; color: var(--muted); font-family: var(--body); font-size: 12px; font-weight: 500; }
.x { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 18px; transition: all .2s; }
.x:hover { background: var(--crit-tint); color: var(--crit); }
.leaving { opacity: 0; transform: translateX(28px); transition: opacity .3s, transform .3s var(--ease); }
.set-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
.set-row:last-child { border-bottom: none; }
.set-row .grow { flex: 1; min-width: 120px; }
.set-row input, .set-row select { width: auto; min-width: 90px; }

/* ------------------------------------------------------------ hero */
.hero { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 24px 26px 20px; display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 1.3fr); gap: 26px; align-items: start; }
@media (max-width: 880px) { .hero { grid-template-columns: 1fr; } }
.hero .kicker { color: var(--muted); font-size: 14px; font-weight: 600; }
.hero .big { font-family: var(--display); font-size: 56px; font-weight: 600; line-height: 1; margin: 6px 0 4px; letter-spacing: -0.01em; }
.hero .big small { font-size: 20px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.hero .big.crit { color: var(--crit); }
.hero .sub { color: var(--ink-2); font-size: 14.5px; max-width: 42ch; }
.macros { display: grid; gap: 8px; margin-top: 16px; }
.macro { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.macro b { font-family: var(--display); font-weight: 600; }
.macro .num { color: var(--ink-2); }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { all: unset; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 8px 2px; border-radius: 12px; border: 1px solid transparent; }
.day:hover { background: var(--panel-2); }
.day .d { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.day .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--axis); }
.day .dot.done { background: var(--accent); border-color: var(--accent); }
.day .dot.skipped { border-color: var(--crit); background: var(--crit-tint); }
.day .dot.planned { border-color: var(--accent); }
.day .dot.rest, .day .dot.void { border-style: dotted; }
.day .k { font-size: 11px; color: var(--ink-2); text-align: center; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day.today { border-color: var(--accent); background: var(--accent-tint); }
.session-card { border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; background: var(--panel-2); margin-top: 14px; }
.session-card h3 { font-size: 17px; }
.session-card ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.quick button { border-radius: 999px; min-height: 40px; }
.countdown { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-top: 14px; }
.countdown .v { font-family: var(--display); font-size: 24px; font-weight: 600; }

/* ------------------------------------------------------------ workout */
.wk-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.wk-head h2 { font-size: 20px; }
.wk-head .elapsed { font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.section-head { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 18px 0 8px; }
.ex { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
.ex.done { opacity: .82; }
.ex .ex-top { display: flex; align-items: flex-start; gap: 10px; }
.ex .ex-top h3 { font-size: 17px; margin: 0; }
.ex .ex-top .scheme { color: var(--muted); font-size: 13px; }
.ex .target { margin-top: 6px; font-size: 13.5px; color: var(--ink-2); }
.ex .target b { color: var(--ink); font-family: var(--display); }
.ex .target .why { display: block; color: var(--muted); font-size: 12.5px; }
.ex .cues { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.ex .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.sets { margin-top: 10px; display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr auto; gap: 8px; align-items: center; }
.set .n { color: var(--muted); font-weight: 600; font-family: var(--display); text-align: center; }
.set.logged { background: var(--panel-2); border-radius: 12px; padding: 8px 8px 8px 0; grid-template-columns: 26px 1fr auto; cursor: pointer; }
.set.logged .sum { font-family: var(--display); font-weight: 600; font-size: 15px; }
.set.logged .sum small { color: var(--muted); font-family: var(--body); font-weight: 500; margin-left: 6px; }
.set.logged .tick { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 15px; }
.set.warm .n { color: var(--burn-ink); }
.stepper { display: grid; grid-template-columns: 40px 1fr 40px; align-items: stretch; border: 1px solid var(--axis); border-radius: 12px; overflow: hidden; background: var(--panel); min-height: var(--tap); }
.stepper button { border: 0; border-radius: 0; background: var(--panel-2); min-height: 100%; font-size: 20px; padding: 0; color: var(--ink-2); }

<script>
"use strict";
/* ---------------------------------------------------------- helpers */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n0 = x => (x == null || isNaN(x)) ? "-" : Math.round(x).toLocaleString("en-NZ");
const n1 = x => (x == null || isNaN(x)) ? "-" : (Math.round(x * 10) / 10).toLocaleString("en-NZ", { maximumFractionDigits: 1 });
const kg = x => x == null ? "" : n1(x) + " kg";
const pad2 = n => String(n).padStart(2, "0");
const isoOf = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const D = iso => new Date(String(iso).slice(0, 10) + "T00:00:00");
const todayIso = () => isoOf(new Date());
const addDays = (iso, n) => { const d = D(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const nowIso = () => { const d = new Date(); return isoOf(d) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); };
const fmtDay   = iso => D(iso).toLocaleDateString("en-NZ", { weekday: "short", day: "numeric", month: "short" });
const fmtLong  = iso => D(iso).toLocaleDateString("en-NZ", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = iso => D(iso).toLocaleDateString("en-NZ", { day: "numeric", month: "short" });
const fmtDate  = iso => D(iso).toLocaleDateString("en-NZ", { day: "numeric", month: "short", year: "numeric" });
const wdShort  = iso => D(iso).toLocaleDateString("en-NZ", { weekday: "short" });
const plural = (n, w) => n + " " + (n === 1 ? w : w + "s");
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + pad2(s % 60); };
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 86400000);
const ls = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const SLOT_NAMES = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snacks" };
const SLOTS = ["breakfast", "lunch", "dinner", "snack"];
const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const KIND_SHORT = { upper_a: "Upper A", lower_a: "Lower A", upper_b: "Upper B", lower_b: "Lower B", conditioning: "Conditioning", zone2: "Zone 2", rest: "Rest" };

/* ---------------------------------------------------------- state */
let S = null;        // /api/state
let T = null;        // /api/today, cached for the gym
let FOODS = null;    // /api/foods/list rows
let ONLINE = true;
let PAIRING = false;
const DEVICE = ls.get("ft-device") || (() => { const d = uid(); ls.set("ft-device", d); return d; })();
let KEY = ls.get("ft-key");
{ const p = new URLSearchParams(location.search); if (p.get("key")) { KEY = p.get("key"); ls.set("ft-key", KEY); } }
const UI = { tab: ls.get("ft-tab", "today"), foodDate: todayIso(), planDate: todayIso(), progressDays: 90, histRange: 90, histQ: "", exQ: "", foodQ: "" };
let W = ls.get("ft-live");       // the workout in progress, mirrored on every tap
const REST = { end: 0, total: 0, timer: null, finished: false };
const IS_ANDROID_APP = !!(window.Android && window.Android.saveFile);

/* Keep the screen on while a workout is open, so the rest timer can always buzz. */
let wakeLock = null;
async function keepAwake(on) {
  if (IS_ANDROID_APP && window.Android.keepAwake) { try { window.Android.keepAwake(!!on); } catch (e) {} return; }
  if (!("wakeLock" in navigator)) return;
  if (on) {
    if (wakeLock) return;
    try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } catch (e) { wakeLock = null; }
  } else if (wakeLock) {
    try { await wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
}
const wantAwake = () => !!W && (!S || S.settings.keep_awake !== false);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wantAwake()) keepAwake(true); });

/* Haptics: the Android app has real effects, a browser gets the vibrate API. */
function haptic(kind) {
  if (IS_ANDROID_APP && window.Android.haptic) { try { window.Android.haptic(kind); } catch (e) {} return; }
  if (navigator.vibrate) navigator.vibrate(kind === "double" ? [200, 100, 200] : kind === "heavy" ? 60 : 15);
}
/* The Android back button closes a sheet or returns to Today before it leaves the app. */
window.__androidBack = () => {
  if (!$("#sheetBack").hidden) { closeSheet(); return true; }
  if (UI.tab !== "today") { switchTab("today"); return true; }
  return false;
};

/* ---------------------------------------------------------- api */
class PairError extends Error { constructor() { super("Not paired"); } }
async function api(method, path, body, opts = {}) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (KEY) headers["X-Pair-Key"] = KEY;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opts.timeout || 15000);
  let r;
  try {
    r = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body), signal: ctrl.signal, cache: "no-store", credentials: "same-origin" });
  } finally { clearTimeout(timer); }
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && j && j.error === "pair") throw new PairError();
  if (r.status === 503 && j && j.error === "offline") { const e = new Error("offline"); e.offline = true; throw e; }
  if (!r.ok) throw new Error((j && j.error) || "Request failed (" + r.status + ")");
  return j;
}

/* ---------------------------------------------------------- offline queue (IndexedDB) */
function qOpen() {
  return new Promise((res, rej) => {
    const o = indexedDB.open("fitness", 1);
    o.onupgradeneeded = () => { if (!o.result.objectStoreNames.contains("queue")) o.result.createObjectStore("queue", { keyPath: "client_id" }); };
    o.onsuccess = () => res(o.result);
    o.onerror = () => rej(o.error);
  });
}
async function qPut(op) { const db = await qOpen(); return new Promise((res, rej) => { const tx = db.transaction("queue", "readwrite"); tx.objectStore("queue").put(op); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function qAll() { const db = await qOpen(); return new Promise((res, rej) => { const r = db.transaction("queue", "readonly").objectStore("queue").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
async function qDelete(ids) { if (!ids.length) return; const db = await qOpen(); return new Promise((res, rej) => { const tx = db.transaction("queue", "readwrite"); const st = tx.objectStore("queue"); ids.forEach(id => st.delete(id)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function qCount() { try { return (await qAll()).length; } catch (e) { return 0; } }

/* Every write goes through here: apply locally, queue it, try to send it. */
async function mutate(type, client_id, payload, local) {
  payload = Object.assign({}, payload, { updated_at: nowIso() });
  const op = { type, client_id, payload, at: nowIso() };
  if (local) { try { local(); } catch (e) { console.error(e); } }
  try { await qPut(op); } catch (e) { console.error("queue", e); }
  updateNotice();
  flush();
  return client_id;
}
let flushing = false;
async function flush() {
  if (flushing) return;
  flushing = true;
  try {
    const ops = (await qAll()).sort((a, b) => (a.at || "").localeCompare(b.at || ""));
    if (!ops.length) return;
    const res = await api("POST", "/api/sync", { device: DEVICE, ops: ops.slice(0, 200) }, { timeout: 8000 });
    ONLINE = true;
    const hard = res.rejected.filter(r => !r.retry);
    hard.forEach(r => { toast(r.error); const errs = ls.get("ft-sync-errors", []); errs.unshift({ at: nowIso(), error: r.error, client_id: r.client_id }); ls.set("ft-sync-errors", errs.slice(0, 20)); });
    await qDelete(res.applied.concat(hard.map(r => r.client_id)));
    if (res.applied.length) await load(true);
    if (ops.length > 200) setTimeout(flush, 50);
  } catch (e) {
    if (e instanceof PairError) showPairing();
    else ONLINE = false;
  } finally {
    flushing = false;
    updateNotice();
  }
}
setInterval(async () => { if (await qCount()) flush(); }, 30000);
window.addEventListener("online", () => flush());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { flush(); if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.getRegistration().then(r => r && r.update()); } });

async function updateNotice() {
  const n = await qCount();
  const el = $("#notice");
  if (PAIRING) { el.innerHTML = `<span class="notice crit"><span class="dot"></span>Not paired</span>`; return; }
  if (!ONLINE) { el.innerHTML = `<span class="notice warn"><span class="dot"></span>Offline${n ? ", " + plural(n, "change") + " waiting" : ""}</span>`; return; }
  el.innerHTML = n ? `<span class="notice"><span class="dot"></span>${plural(n, "change")} syncing</span>` : "";
}

/* ---------------------------------------------------------- load */
async function load(quiet) {
  try {
    const [s, t] = await Promise.all([api("GET", "/api/state"), api("GET", "/api/today")]);
    S = s; T = t; ONLINE = true;
    ls.set("ft-state", S); ls.set("ft-today", T);
    if (W && !S.in_progress && !(await qCount()) && !W.local) { /* finished or discarded on the other device */ W = null; saveW(); stopRest(); }
    if (W && S.in_progress && S.in_progress.client_id === W.client_id) W.local = false;   // the laptop knows about it now
  } catch (e) {
    if (e instanceof PairError) { showPairing(); return; }
    ONLINE = false;
    if (!S) S = ls.get("ft-state");
    if (!T) T = ls.get("ft-today");
    if (!S && !T) {
      $("main").innerHTML = `<div class="card"><h2>Could not reach the server</h2><p class="hint">On the laptop, start Fitness Tracker (double-click the .exe or run <code>python fitness_tracker.py</code>) and reload. On the phone, open it once at home so it can be saved for offline use. ${esc(e.message)}</p></div>`;
      updateNotice();
      return;
    }
    if (!quiet) toast("Offline. Showing what was saved on this device.");
  }
  renderAll();
  updateNotice();
}
function saveW() { if (W) ls.set("ft-live", W); else ls.del("ft-live"); $("#navLive").hidden = !W; keepAwake(wantAwake()); }

let toastTimer = null;
function toast(msg, undo, ms) {
  const el = $("#toast");
  el.innerHTML = esc(msg) + (undo ? ` <button type="button">Undo</button>` : "");
  if (undo) $("button", el).addEventListener("click", async () => { el.classList.remove("show"); try { await undo(); } catch (e) { toast(e.message); } });
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), ms || (undo ? 6000 : 2600));
}
function showTip(html, ev) {
  const t = $("#tip"); t.innerHTML = html; t.classList.add("show");
  const pad = 14; let x = ev.clientX + pad, y = ev.clientY + pad;
  const r = t.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function hideTip() { $("#tip").classList.remove("show"); }
document.addEventListener("touchstart", e => { if (!e.target.closest("svg")) hideTip(); }, { passive: true });

function openSheet(html, onOpen) {

  if (first && !matchMedia("(max-width: 640px)").matches) first.focus();
}

/* Service worker: offline shell, plus a toast when a new version is waiting. */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").then(reg => {
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController) toast("Updated. Tap to reload", () => location.reload(), 12000);
      hadController = true;
    });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "flushed" && e.data.applied) load(true); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
setInterval(() => fetch("/api/ping", { cache: "no-store" }).catch(() => {}), 20000);

/* ---------------------------------------------------------- shared bits */
function targetLine(it) {
  const t = it.target; if (!t) return "";
  const scheme = it.sets ? `${it.sets} x ${it.rep_low}-${it.rep_high}${it.exercise && it.exercise.timed ? " s" : ""}` : "";
  const last = t.last && t.last.sets && t.last.sets.length ? `Last (${fmtShort(t.last.date)}): ${summariseSets(t.last.sets, it.exercise)}` : "First time";
  const tgt = t.weight != null ? `Target: ${scheme} at <b>${kg(t.weight)}</b>${it.exercise && it.exercise.per_hand ? " each" : ""}` : `Target: ${scheme}`;
  return `${last}. ${tgt}<span class="why">${esc(t.text || "")}</span>`;
}
function summariseSets(sets, ex) {
  const timed = ex && ex.timed;
  const groups = [];
  sets.forEach(s => {
    const g = groups[groups.length - 1];
    if (g && g.w === s.weight && g.r === s.reps) g.n++; else groups.push({ w: s.weight, r: s.reps, n: 1 });
  });
  const rpes = sets.map(s => s.rpe).filter(x => x != null);
  const rpe = rpes.length ? ", RPE " + n1(rpes.reduce((a, b) => a + b, 0) / rpes.length) : "";
  return groups.map(g => `${g.n} x ${g.r}${timed ? " s" : ""}${g.w ? " at " + kg(g.w) : ""}`).join(", ") + rpe;
}
function weekStrip(strip) {
  const today = todayIso();
  return `<div class="strip">${strip.map(s => {
    const dot = s.status === "done" ? "done" : s.kind === "rest" ? "rest" : s.status;
    return `<button class="day${s.date === today ? " today" : ""}" data-sess="${s.id}" title="${esc(s.title)}">
      <span class="d">${wdShort(s.date)}</span><span class="dot ${dot}"></span><span class="k">${esc(KIND_SHORT[s.kind] || s.title)}</span></button>`;
  }).join("")}</div>`;
}

function sessionCard(s) {
  if (!s) return "";
  if (W && W.session_id === s.id) return `<div class="session-card"><h3>${esc(s.title)} in progress</h3><p class="muted small">Started ${W.started_at.slice(11, 16)}.</p><div class="quick"><button class="primary big" data-go="workout">Continue</button></div></div>`;
  if (s.kind === "rest") return `<div class="session-card"><h3>Rest day</h3><p class="muted small">Recovery counts. If you feel like moving, take an easy walk.</p><div class="quick"><button data-go="plan">See the week</button></div></div>`;
  const names = s.items.filter(i => ["main", "accessory", "core"].includes(i.section)).slice(0, 4).map(i => i.exercise ? i.exercise.name : "").filter(Boolean);
  const fin = s.items.find(i => i.section === "finisher");
  return `<div class="session-card"><div class="between"><h3>${esc(s.title)}${s.is_deload ? ' <span class="pill">deload</span>' : ""}</h3><span class="muted small">about ${n0(s.est_minutes)} min</span></div>
    <ul>${names.map(n => `<li>${esc(n)}</li>`).join("")}${fin ? `<li class="muted">${esc(fin.exercise ? fin.exercise.name : "Cardio")} finisher, ${n0(fin.minutes)} min</li>` : ""}</ul>
    <div class="quick">${s.status === "done" ? `<span class="pill good">Done</span>` : `<button class="primary big" data-start="${s.id}">Start</button>`}<button data-go="plan">Plan</button></div></div>`;
}
function wireToday(root) {
  $$("[data-start]", root).forEach(b => b.addEventListener("click", () => startSession(+b.dataset.start)));
  $$("[data-sess]", root).forEach(b => b.addEventListener("click", () => { UI.planDate = (S.strip.find(s => s.id === +b.dataset.sess) || {}).date || todayIso(); switchTab("plan"); }));
  $$("[data-q]", root).forEach(b => b.addEventListener("click", () => quickLog(b.dataset.q)));
}
function quickLog(kind) {
  const d = todayIso();
  if (kind === "water") {
    const cur = (S.daily.water_ml || 0) + 250;
    mutate("daily", "daily-" + d, { date: d, water_ml: cur }, () => { S.daily.water_ml = cur; renderToday(); });
    toast(`${n0(cur)} ml today`);
    return;
  }
  const fields = {
    weight: [["weight_kg", "Weight (kg)", "decimal", S.weight.latest ? S.weight.latest.weight_kg : S.settings.start_weight_kg], ["waist_cm", "Waist (cm), optional", "decimal", ""], ["chest_cm", "Chest (cm), optional", "decimal", ""], ["arm_cm", "Upper arm (cm), optional", "decimal", ""], ["hip_cm", "Hips (cm), optional", "decimal", ""], ["thigh_cm", "Thigh (cm), optional", "decimal", ""]],
    sleep: [["sleep_h", "Hours slept", "decimal", S.daily.sleep_h || ""]],
    steps: [["steps", "Steps", "numeric", S.daily.steps || ""]],
  }[kind];
  const titles = { weight: "Log your weight", sleep: "Last night's sleep", steps: "Steps today" };
  openSheet(`<div class="handle"></div><h2>${titles[kind]}</h2><p class="hint">For ${fmtLong(d)}. Measurements are optional and only need doing monthly.</p>
    ${fields.map(([k, label, mode, val]) => `<label class="field mb"><span>${label}</span><input type="number" step="0.1" inputmode="${mode}" id="q-${k}" value="${val ?? ""}"></label>`).join("")}
    <div class="row mt"><button class="primary big" id="qSave">Save</button><button class="ghost" id="qCancel">Cancel</button></div>`, sh => {
    $("#qCancel", sh).addEventListener("click", closeSheet);
    $("#qSave", sh).addEventListener("click", () => {
      const payload = { date: d };
      fields.forEach(([k]) => { const v = $("#q-" + k, sh).value; if (v !== "") payload[k] = +v; });
      if (kind === "weight") {
        if (!payload.weight_kg) { toast("Type your weight"); return; }
        mutate("body", "body-" + d, payload, () => { S.weight.latest = { date: d, weight_kg: payload.weight_kg }; S.weight.trend = payload.weight_kg; });
      } else {
        mutate("daily", "daily-" + d, payload, () => { Object.assign(S.daily, payload); });
      }
      closeSheet(); renderToday(); toast("Saved");
    });
  });
}

/* ---------------------------------------------------------- Workout */
function sessionById(id) {
  return (T && T.sessions.find(s => s.id === id)) || (S && S.week && S.week.sessions.find(s => s.id === id)) || null;
}
function startSession(id) {
  const s = sessionById(id);
  if (!s) { toast("That session is not loaded yet"); return; }
  if (W) { toast("Finish or discard the current workout first"); switchTab("workout"); return; }
  const today = todayIso();
  const items = JSON.parse(JSON.stringify(s.items));
  W = { client_id: uid(), session_id: s.id, date: today, started_at: nowIso(), title: s.title, kind: s.kind, is_deload: s.is_deload, items, sets: {}, cardio: [], skipped: {}, open: {}, local: true };
  if (IS_ANDROID_APP && window.Android.requestNotifications) { try { window.Android.requestNotifications(); } catch (e) {} }
  saveW();
  mutate("workout", W.client_id, { session_id: s.id, date: today, started_at: W.started_at });
  switchTab("workout");
}
function startFreestyle() {
  const today = todayIso();
  W = { client_id: uid(), session_id: null, date: today, started_at: nowIso(), title: "Freestyle", kind: "adhoc", items: [], sets: {}, cardio: [], skipped: {}, open: {}, local: true };
  saveW();
  mutate("workout", W.client_id, { date: today, started_at: W.started_at });
  switchTab("workout");
}
function renderWorkout() {
  const root = $("#p-workout");
  $("#navLive").hidden = !W;
  if (!W) {
    // resume a workout started on another device
    if (S && S.in_progress && !W) {
      const ip = S.in_progress;
      const sess = sessionById(ip.session_id);
      root.innerHTML = `<div class="card"><h2>A workout is open</h2><p class="hint">Started ${esc((ip.started_at || "").slice(0, 16).replace("T", " "))}${sess ? " for " + esc(sess.title) : ""}, probably on your other device. Finish it there, or take it over here.</p>
        <div class="row"><button class="primary" id="takeover">Take over here</button><button class="danger" id="discardOpen">Discard it</button></div></div>`;
      $("#takeover").addEventListener("click", async () => {
        try {
          const det = await api("GET", "/api/workouts/" + ip.client_id);
          W = { client_id: det.client_id, session_id: det.session_id, date: det.date, started_at: det.started_at, title: sess ? sess.title : "Workout", kind: sess ? sess.kind : "adhoc", is_deload: sess && sess.is_deload, items: sess ? JSON.parse(JSON.stringify(sess.items)) : [], sets: {}, cardio: det.cardio.map(c => ({ client_id: c.client_id, plan_item_id: c.plan_item_id, minutes: c.minutes, intensity: c.intensity })), skipped: {}, open: {}, local: false };
          det.sets.forEach(s => { (W.sets[s.plan_item_id || "x" + s.exercise_id] = W.sets[s.plan_item_id || "x" + s.exercise_id] || []).push({ client_id: s.client_id, set_no: s.set_no, reps: s.reps, weight: s.weight_kg, rpe: s.rpe, is_warmup: s.is_warmup, done_at: s.done_at }); });
          saveW(); renderWorkout();
        } catch (e) { toast(e.message); }
      });
      $("#discardOpen").addEventListener("click", () => { if (confirm("Discard that open workout? Its sets will be removed.")) { mutate("workout", ip.client_id, { deleted: 1 }); S.in_progress = null; renderWorkout(); } });
      return;
    }
    const sessions = (T && T.sessions) || (S && S.week ? S.week.sessions : []);
    const today = todayIso();

  const q = tokens(query);

    return FOODS.filter(f => f.last_used).sort((a, b) => String(b.last_used).localeCompare(String(a.last_used)) || (b.times_used || 0) - (a.times_used || 0)).slice(0, 20);
  }

  if (!scored.length) for (const f of FOODS) { const [m, ex] = score(f); if (m) scored.push([f, m, ex]); }
  scored.sort((a, b) => (b[1] - a[1]) || (b[2] - a[2]) || ((SOURCE_RANK[a[0].source] ?? 3) - (SOURCE_RANK[b[0].source] ?? 3)) || ((b[0]._tokens[0] || "").startsWith(q[0]) - (a[0]._tokens[0] || "").startsWith(q[0])) || ((b[0].times_used || 0) - (a[0].times_used || 0)) || (a[0].name.length - b[0].name.length));

}

const PALETTE = ["#3E6B48", "#35639C", "#C06A2C", "#7A5C99", "#4E8F86", "#B04A4A", "#8A7A2E", "#5A6E86", "#9C6B3E", "#6B8E4E"];
function chart(root, cats, series, opts = {}) {

  const bw = Math.min(28, (slot * 0.7) / groupN);

  bars.forEach((s, bi) => {
    s.values.forEach((v, i) => {
      if (v == null || v === 0) return;
      let x, y0, y1;
      if (s.stack) { y0 = stackBase[i]; y1 = y0 + v; stackBase[i] = y1; x = X(i) - Math.min(28, slot * 0.7) / 2; }
      else { const gi = bars.filter(b => !b.stack).indexOf(s); x = X(i) - (bw * groupN) / 2 + gi * bw; y0 = 0; y1 = v; }

      body += `<rect x="${x.toFixed(1)}" y="${Y(y1).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, Y(y0) - Y(y1)).toFixed(1)}" rx="3" fill="${s.color}"/>`;

  });

  const hits = cats.map((c, i) => `<rect x="${(X(i) - slot / 2).toFixed(1)}" y="${m.t}" width="${slot.toFixed(1)}" height="${ih}" fill="transparent" data-i="${i}"/>`).join("");

function paceAt(pace, d) {

  openSheet(`<div class="handle"></div><h2>${ex ? esc(ex.name) : "Add an exercise"}</h2>
    <div class="f-row"><label class="field grow"><span>Name</span><input type="text" id="x-name" value="${esc(ex ? ex.name : "")}"></label>
      ${ex ? "" : `<label class="field narrow"><span>Pattern</span><select id="x-pattern">${patterns.map(p => `<option value="${p}">${p.replace("_", " ")}</option>`).join("")}</select></label>
      <label class="field narrow"><span>Main muscle</span><select id="x-muscle">${muscles.map(p => `<option value="${p}">${p}</option>`).join("")}</select></label>`}
      <label class="field narrow"><span>Equipment</span><select id="x-equip">${equip.map(p => `<option value="${p}"${ex && ex.equipment === p ? " selected" : ""}>${p.replace("_", " ")}</option>`).join("")}</select></label></div>
    <div class="f-row"><label class="field grow"><span>Weight step when you progress (kg), blank for the default</span><input type="number" step="0.5" inputmode="decimal" id="x-inc" value="${ex && ex.increment_kg != null ? ex.increment_kg : ""}"></label>
      <label class="field grow"><span>Lightest load (kg), blank for the default</span><input type="number" step="0.5" inputmode="decimal" id="x-min" value="${ex && ex.min_load_kg != null ? ex.min_load_kg : ""}"></label></div>
    <div class="cap">Form cues, up to three</div>${[0, 1, 2].map(i => `<input type="text" class="mb" id="x-cue${i}" value="${esc(cues[i] || "")}" placeholder="One clear thing to remember">`).join("")}
    <div class="row mt"><button class="primary big" id="x-save">Save</button><button class="ghost" id="x-cancel">Cancel</button></div>`, sh => {
    $("#x-cancel", sh).addEventListener("click", closeSheet);
    $("#x-save", sh).addEventListener("click", async () => {
      const body = { name: $("#x-name", sh).value.trim(), equipment: $("#x-equip", sh).value, cues: [0, 1, 2].map(i => $("#x-cue" + i, sh).value.trim()).filter(Boolean),
        increment_kg: $("#x-inc", sh).value === "" ? null : +$("#x-inc", sh).value, min_load_kg: $("#x-min", sh).value === "" ? null : +$("#x-min", sh).value };
      if (!body.name) { toast("Give it a name"); return; }
      try {
        if (ex) await api("PUT", "/api/exercises/" + ex.id, body);
        else await api("POST", "/api/exercises", Object.assign(body, { pattern: $("#x-pattern", sh).value, primary_muscle: $("#x-muscle", sh).value }));
        closeSheet(); toast("Saved"); await load(true); renderSettings();
      } catch (e) { toast(e.message); }
    });
  });
}
async function renderMyFoods(root) {
  if (!FOODS) await loadFoods();
  const mine = (FOODS || []).filter(f => f.source === "custom" || f.source === "off").sort((a, b) => a.name.localeCompare(b.name));
  $("#myFoods", root).innerHTML = mine.length ? mine.slice(0, 40).map(f => `<div class="lg-row"><div class="lg-what"><div class="t">${esc(f.name)}</div><div class="c">${esc(f.brand || "")}${f.brand ? " · " : ""}${n0(f.kcal_100)} kcal, ${n1(f.protein_100)} p per 100 ${esc(f.unit)} · ${f.source === "off" ? "Open Food Facts" : "yours"}</div></div>${f.id ? `<button class="ghost" data-hidefood="${f.id}">Hide</button>` : `<span class="pill">waiting to sync</span>`}</div>`).join("") : `<div class="muted small">No foods of your own yet. Add one from the Food tab.</div>`;
  $$("[data-hidefood]", root).forEach(b => b.addEventListener("click", async () => { try { await api("DELETE", "/api/foods/" + b.dataset.hidefood); FOODS = FOODS.filter(f => String(f.id) !== b.dataset.hidefood); toast("Hidden"); renderMyFoods(root); } catch (e) { toast(e.message); } }));
  try {
    const meals = await api("GET", "/api/meals");
    $("#myMeals", root).innerHTML = `<div class="cap">Saved meals</div>` + (meals.length ? meals.map(m => `<div class="lg-row"><div class="lg-what"><div class="t">${esc(m.name)}</div><div class="c">${m.items.map(i => esc(i.name)).join(", ")} · ${n0(m.kcal)} kcal</div></div><button class="ghost" data-delmeal="${m.id}">Delete</button></div>`).join("") : `<div class="muted small">None yet. Use "Save as meal" on a slot in Food.</div>`);
    $$("[data-delmeal]", root).forEach(b => b.addEventListener("click", async () => { try { await api("DELETE", "/api/meals/" + b.dataset.delmeal); toast("Deleted"); renderMyFoods(root); } catch (e) { toast(e.message); } }));
  } catch (e) {}
}
async function renderPhone(root) {
  const body = $("#phoneBody", root);
  let swVersion = "not running";
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      swVersion = await new Promise(res => { const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data.version); navigator.serviceWorker.controller.postMessage({ type: "version" }, [ch.port2]); setTimeout(() => res("unknown"), 800); });
    }
  } catch (e) {}
  const errs = ls.get("ft-sync-errors", []);
  const offlineLine = `<div class="kv mt"><b>Offline ready</b><span>${swVersion === "not running" ? "No, open the page over https or on the laptop once" : "Yes, version " + esc(swVersion)}</span><b>This device</b><span>${esc(DEVICE.slice(0, 8))}</span></div>`;
  if (!S.phone) {
    body.innerHTML = `<p class="hint">You are on the phone. Pairing is done. Sets you log with no connection are sent when you are back on home wifi.</p>${offlineLine}
      ${errs.length ? `<div class="callout warn mt"><strong>Changes the laptop refused</strong><br>${errs.slice(0, 5).map(e => esc(e.at.slice(0, 16).replace("T", " ")) + ": " + esc(e.error)).join("<br>")}</div>` : ""}`;
    return;
  }
  let info;
  try { info = await api("GET", "/api/phone"); } catch (e) { body.innerHTML = `<p class="hint">${esc(e.message)}</p>`; return; }
  const cert = info.cert || {};
  const certLine = !info.https ? `<span class="pill crit">off</span> ${esc(info.reason || "")}` : cert.covers_lan === false ? `<span class="pill warn">wrong address</span> The certificate does not cover ${esc(info.lan_ip)}. Run tools\\make_cert.bat then press Reload certificate.` : `<span class="pill good">on</span> https://${esc(info.lan_ip)}:${info.port}${cert.info && cert.info.not_after ? `, certificate valid to ${esc(cert.info.not_after)}` : ""}${cert.expires_soon ? ' <span class="pill warn">expires soon</span>' : ""}`;
  body.innerHTML = `<p class="hint">Your phone joins over home wifi. Set it up once with the steps below; after that it just works, and at the gym it works on its own.</p>
    <div class="kv"><b>Phone listener</b><span>${certLine}</span><b>Laptop</b><span>${esc(info.hostname)} at ${esc(info.lan_ip || "no network")}</span></div>
    ${info.https ? `<div class="mt"><div class="cap">1. Certificate for the phone</div><p class="small muted">On the phone open <code>${esc(info.ca_url)}</code>. Chrome will say it is not private the first time; choose Advanced, then Proceed, and the file downloads. Install it from Settings, Security and privacy, More security settings, Encryption and credentials, Install a certificate, CA certificate. Close Chrome fully afterwards.</p>
      <div class="cap mt">2. Pairing link</div><div class="row"><code id="pairUrl">${esc(info.url)}</code><button id="copyUrl">Copy</button></div><p class="small muted">Open it on the phone once. Then use Chrome's menu, Add to Home screen.</p></div>` :
      `<div class="callout warn mt"><strong>Run tools\\make_cert.bat</strong> on this laptop, then restart the app. It makes the certificates the phone needs and only takes a moment.</div>`}
    <div class="row mt"><button id="reloadCert">Reload certificate</button><button class="ghost" id="newKey">New pairing code</button></div>
    ${offlineLine}
    ${errs.length ? `<div class="callout warn mt"><strong>Changes the laptop refused</strong><br>${errs.slice(0, 5).map(e => esc(e.at.slice(0, 16).replace("T", " ")) + ": " + esc(e.error)).join("<br>")}</div>` : ""}`;
  const cp = $("#copyUrl", body); if (cp) cp.addEventListener("click", async () => { try { await navigator.clipboard.writeText(info.url); toast("Link copied"); } catch (e) { toast("Select the link and copy it"); } });
  $("#reloadCert", body).addEventListener("click", async () => { try { const r = await api("POST", "/api/phone/reload-cert"); toast(r.ok ? "Certificate reloaded" : r.reason || "Could not reload"); renderPhone(root); } catch (e) { toast(e.message); } });
  $("#newKey", body).addEventListener("click", async () => { if (!confirm("Make a new pairing code? Your phone will need to open the new link once.")) return; try { await api("POST", "/api/phone/new-key"); toast("New code made"); renderPhone(root); } catch (e) { toast(e.message); } });
}

switchTab(UI.tab);
load();
