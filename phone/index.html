<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3E6B48">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fitness">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Fitness Tracker</title>
<style>
/* ------------------------------------------------------------------
   Colour. A warm plaster page, ink the colour of wet slate, and a deep
   English green for the app itself. Two chart hues only: a lake blue for
   food eaten and a terracotta for calories burned and effort. Blue and
   terracotta stay apart for every common kind of colour blindness. The
   green is only ever drawn on its own.
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --plane: #F2F1EC; --panel: #FFFFFF; --panel-2: #F6F5F0; --panel-3: #ECEBE4;
  --ink: #1E2A26; --ink-2: #47554F; --muted: #6B776F;
  --line: rgba(30,42,38,.12); --grid: #E3E4DD; --axis: #C9CDC4;
  --accent: #3E6B48; --accent-ink: #33603F; --accent-tint: rgba(62,107,72,.12); --on-accent: #FFFFFF;
  --fuel: #35639C; --fuel-ink: #2F589A; --fuel-tint: rgba(53,99,156,.12);
  --burn: #C06A2C; --burn-ink: #9E5620; --burn-tint: rgba(192,106,44,.13);
  --good: #3E6B48; --good-tint: rgba(62,107,72,.13);
  --warn: #8A5A12; --warn-tint: rgba(197,160,70,.22);
  --crit: #A33A24; --crit-tint: rgba(163,58,36,.11);
  --grey: #8C948E;
  --shadow: 0 4px 12px rgba(30,42,38,.06); --lift: 0 12px 26px rgba(30,42,38,.12);
  --display: Bahnschrift, "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.25,.8,.25,1);
  --tap: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #171C1A; --panel: #212826; --panel-2: #2A332F; --panel-3: #333D38;
    --ink: #ECEFEA; --ink-2: #BCC5BF; --muted: #8F9B94;
    --line: rgba(255,255,255,.10); --grid: #313A36; --axis: #414C46;
    --accent: #86BE94; --accent-ink: #A3D4AF; --accent-tint: rgba(134,190,148,.16); --on-accent: #10201A;
    --fuel: #7AA3E0; --fuel-ink: #9DBDEE; --fuel-tint: rgba(122,163,224,.18);
    --burn: #D48A4A; --burn-ink: #E5A672; --burn-tint: rgba(212,138,74,.18);
    --good: #86BE94; --good-tint: rgba(134,190,148,.14);
    --warn: #E0B45B; --warn-tint: rgba(224,180,91,.16);
    --crit: #E98A73; --crit-tint: rgba(233,138,115,.14);
    --grey: #6F7A74;
    --shadow: 0 4px 14px rgba(0,0,0,.35); --lift: 0 12px 26px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #171C1A; --panel: #212826; --panel-2: #2A332F; --panel-3: #333D38;
  --ink: #ECEFEA; --ink-2: #BCC5BF; --muted: #8F9B94;
  --line: rgba(255,255,255,.10); --grid: #313A36; --axis: #414C46;
  --accent: #86BE94; --accent-ink: #A3D4AF; --accent-tint: rgba(134,190,148,.16); --on-accent: #10201A;
  --fuel: #7AA3E0; --fuel-ink: #9DBDEE; --fuel-tint: rgba(122,163,224,.18);
  --burn: #D48A4A; --burn-ink: #E5A672; --burn-tint: rgba(212,138,74,.18);
  --good: #86BE94; --good-tint: rgba(134,190,148,.14);
  --warn: #E0B45B; --warn-tint: rgba(224,180,91,.16);
  --crit: #E98A73; --crit-tint: rgba(233,138,115,.14);
  --grey: #6F7A74;
  --shadow: 0 4px 14px rgba(0,0,0,.35); --lift: 0 12px 26px rgba(0,0,0,.5);
}

/* ------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
body { background: var(--plane); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background-color .3s ease, color .3s ease; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 90px; }
h1, h2, h3, .num, .display { font-family: var(--display); letter-spacing: 0; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
p { margin: 0; }
.hint { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.good-ink { color: var(--good); } .crit-ink { color: var(--crit); } .fuel-ink { color: var(--fuel-ink); } .burn-ink { color: var(--burn-ink); } .accent-ink { color: var(--accent-ink); }
[hidden] { display: none !important; }
a { color: var(--accent-ink); }
code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; background: var(--panel-2); padding: 1px 6px; border-radius: 6px; word-break: break-all; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.spacer { flex: 1 1 auto; }
.mt { margin-top: 12px; } .mt2 { margin-top: 20px; } .mb { margin-bottom: 12px; }

button, .btn { font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 15px; min-height: 40px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s ease, border-color .15s ease, transform .15s var(--ease), box-shadow .2s ease, color .15s; }
button:hover, .btn:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; font-family: var(--display); }
button.primary:hover { filter: brightness(1.06); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--ink); background: var(--panel-2); border-color: transparent; }
button.link { background: none; border: 0; padding: 4px 6px; min-height: 0; color: var(--accent-ink); font-weight: 600; }
button.link:hover { text-decoration: underline; }
button.good { background: var(--good-tint); border-color: transparent; color: var(--good); font-weight: 600; }
button.warn { background: var(--warn-tint); border-color: transparent; color: var(--warn); font-weight: 600; }
button.danger { background: var(--crit-tint); border-color: transparent; color: var(--crit); font-weight: 600; }
button.big { min-height: var(--tap); padding: 10px 20px; font-size: 15px; border-radius: 14px; }
button.wide { width: 100%; }
button[disabled] { opacity: .45; cursor: default; pointer-events: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type="number"], input[type="date"], input[type="text"], input[type="search"], input[type="time"], input[type="email"], select, textarea { font: inherit; font-size: 15px; padding: 10px 12px; width: 100%; min-height: 44px; border: 1px solid var(--axis); border-radius: 12px; background: var(--panel); color: var(--ink); transition: border-color .15s ease; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="number"] { font-variant-numeric: tabular-nums; }
label.field { display: block; }
label.field > span:first-child, .cap { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
.f-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 14px; }
.f-row .grow { flex: 1 1 200px; }
.f-row .narrow { flex: 0 1 160px; }
@media (max-width: 640px) { .f-row > * { flex: 1 1 100% !important; } }

/* ------------------------------------------------------------ header and nav */
header.top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 20px; height: 20px; stroke: var(--on-accent); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.brand h1 { font-size: 20px; font-weight: 600; margin: 0; }
.notice { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-tint); color: var(--ink-2); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.notice.warn { background: var(--warn-tint); }
.notice.crit { background: var(--crit-tint); color: var(--crit); }
.notice .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.notice.warn .dot { background: var(--warn); } .notice.crit .dot { background: var(--crit); }
#notice:empty { display: none; }
.upd { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; background: var(--accent-tint); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 0 0 14px; font-size: 14px; color: var(--ink-2); }
.upd b { color: var(--ink); }
.upd .acts { display: flex; gap: 6px; }
.upd button { min-height: 36px; }
.upd details { grid-column: 1 / -1; font-size: 13.5px; }
.upd details > summary { cursor: pointer; color: var(--accent-ink); font-weight: 600; list-style: none; }
.upd details > summary::-webkit-details-marker { display: none; }
.upd ul { margin: 6px 0 0; padding-left: 18px; }
.upd .state { grid-column: 1 / -1; font-size: 13px; }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; color: var(--muted); }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .slider { position: relative; width: 46px; height: 26px; border-radius: 999px; background: var(--axis); transition: background .3s; flex: none; }
.switch .slider::before { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .3s var(--ease); }
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); }
.switch svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn { width: 38px; height: 38px; min-height: 0; padding: 0; border-radius: 50%; color: var(--ink-2); }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.dark .sun, .iconbtn:not(.dark) .moon { display: none; }

nav.tiles { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.tile { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border: 0; border-radius: 8px 8px 0 0; font-family: var(--display); font-weight: 600; font-size: 15px; background: transparent; color: var(--muted); box-shadow: none; transition: color .15s ease, background .15s ease; }
.tile:hover { color: var(--ink); background: var(--panel-2); }
.tile[aria-selected="true"] { color: var(--accent-ink); box-shadow: inset 0 -2px 0 var(--accent); }
.tile .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--burn-tint); color: var(--burn-ink); font-variant-numeric: tabular-nums; }

.bottombar { display: none; }
@media (max-width: 640px) {
  nav.tiles { display: none; }
  .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .bottombar button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; min-height: 52px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--display); padding: 4px 2px; }
  .bottombar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bottombar button.on { color: var(--accent-ink); background: var(--accent-tint); }
  .bottombar button { position: relative; }
  .bottombar .live { position: absolute; top: 7px; left: calc(50% + 10px); width: 8px; height: 8px; border-radius: 50%; background: var(--burn); animation: pulse 1.6s ease-in-out infinite; }
  header.top { margin-bottom: 14px; }
}
.more { display: grid; gap: 8px; }
.more button { justify-content: flex-start; gap: 14px; min-height: 58px; text-align: left; border-radius: 14px; padding: 8px 16px; }
.more button svg { width: 22px; height: 22px; flex: none; stroke: var(--accent-ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.more button span { display: flex; flex-direction: column; font-family: var(--display); font-weight: 600; font-size: 15px; }
.more button small { color: var(--muted); font-family: var(--body); font-weight: 400; font-size: 12.5px; }

/* ------------------------------------------------------------ surfaces */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.card + .card, .grid + .card, .card + .grid, .grid + .grid, .hero + .card, .hero + .grid { margin-top: 14px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 880px) { .g2, .g3 { grid-template-columns: 1fr; } .g4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .g4 { grid-template-columns: 1fr 1fr; } }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.stat .l { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat .v { font-family: var(--display); font-size: 26px; font-weight: 600; line-height: 1.15; margin-top: 2px; }
.stat .f { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-tint); color: var(--good); } .pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.crit { background: var(--crit-tint); color: var(--crit); } .pill.fuel { background: var(--fuel-tint); color: var(--fuel-ink); }
.pill.burn { background: var(--burn-tint); color: var(--burn-ink); } .pill.accent { background: var(--accent-tint); color: var(--accent-ink); }
.meter { height: 8px; background: var(--panel-3); border-radius: 999px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s var(--ease); }
.meter.fuel > span { background: var(--fuel); } .meter.burn > span { background: var(--burn); } .meter.over > span { background: var(--crit); }
.callout { border-left: 3px solid var(--accent); background: var(--panel-2); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 14px; color: var(--ink-2); margin-top: 12px; }
.callout.warn { border-left-color: var(--warn); } .callout.crit { border-left-color: var(--crit); }
.callout strong { color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 26px 16px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; padding: 6px 10px; border-bottom: 1px solid var(--grid); }
td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--panel-2); }
.tablewrap { overflow-x: auto; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; cursor: pointer; transition: all .2s var(--ease); color: var(--ink); }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.on.fuel { background: var(--fuel); border-color: var(--fuel); color: #fff; }
.chip small { opacity: .75; font-size: 12px; }
.lg-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--grid); border-radius: 8px; transition: background .15s; }
.lg-row:hover { background: var(--panel-2); } .lg-row:last-child { border-bottom: none; }
.lg-row.click { cursor: pointer; }
.lg-what { min-width: 0; } .lg-what .t { font-weight: 600; } .lg-what .c { color: var(--muted); font-size: 12.5px; }
.lg-amt { text-align: right; font-family: var(--display); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.lg-amt small { display: block; color: var(--muted); font-family: var(--body); font-size: 12px; font-weight: 500; }
.x { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 18px; transition: all .2s; }
.x:hover { background: var(--crit-tint); color: var(--crit); }
.leaving { opacity: 0; transform: translateX(28px); transition: opacity .3s, transform .3s var(--ease); }
.set-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
.set-row:last-child { border-bottom: none; }
.set-row .grow { flex: 1; min-width: 120px; }
.set-row input, .set-row select { width: auto; min-width: 90px; }

/* ------------------------------------------------------------ hero */
.hero { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px 20px; display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 1.3fr); gap: 26px; align-items: start; }
@media (max-width: 880px) { .hero { grid-template-columns: 1fr; } }
.hero .kicker { color: var(--muted); font-size: 14px; font-weight: 600; }
.hero .big { font-family: var(--display); font-size: 56px; font-weight: 600; line-height: 1; margin: 6px 0 4px; letter-spacing: -0.01em; }
.hero .big small { font-size: 20px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.hero .big.crit { color: var(--crit); }
.hero .sub { color: var(--ink-2); font-size: 14.5px; max-width: 42ch; }
.macros { display: grid; gap: 8px; margin-top: 16px; }
.macro { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.macro b { font-family: var(--display); font-weight: 600; }
.macro .num { color: var(--ink-2); }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { all: unset; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 8px 2px; border-radius: 12px; border: 1px solid transparent; }
.day:hover { background: var(--panel-2); }
.day .d { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.day .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--axis); display: grid; place-items: center; font-size: 9px; line-height: 1; font-weight: 700; color: var(--on-accent); }
.day .dot.done { background: var(--accent); border-color: var(--accent); }
.day .dot.skipped { border-color: var(--crit); background: var(--crit-tint); }
.day .dot.planned { border-color: var(--accent); }
.day .dot.rest, .day .dot.void { border-style: dotted; }
.day .k { font-size: 11px; color: var(--ink-2); text-align: center; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day.today { border-color: var(--accent); background: var(--accent-tint); }
.session-card { border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; background: var(--panel-2); margin-top: 14px; }
.session-card h3 { font-size: 17px; }
.session-card ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.quick button { border-radius: 999px; min-height: 40px; }
.quick button.primary { border-radius: 14px; min-height: 46px; padding: 10px 22px; font-size: 15px; }
@media (max-width: 640px) {
  .quick4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .quick4 button { flex-direction: column; gap: 0; padding: 6px 4px; min-height: 50px; border-radius: 12px; }
  .quick4 .pill { padding: 0; background: none; font-size: 11.5px; color: var(--muted); }
}

/* ------------------------------------------------------------ workout */

.sets { margin-top: 10px; display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr auto; gap: 8px; align-items: center; }

.stepper { display: grid; grid-template-columns: 40px 1fr 40px; align-items: stretch; border: 1px solid var(--axis); border-radius: 12px; overflow: hidden; background: var(--panel); min-height: var(--tap); }
.stepper button { border: 0; border-radius: 0; background: var(--panel-2); min-height: 100%; font-size: 20px; padding: 0; color: var(--ink-2); }
.stepper input { border: 0; border-radius: 0; text-align: center; font-family: var(--display); font-weight: 600; font-size: 17px; min-height: 100%; padding: 4px 2px; min-width: 0; }
.stepper input:focus { outline: none; }
.stepper .u { font-size: 11px; color: var(--muted); text-align: center; }
/* Weight as a dumbbell: thin iron plates at each end carry − and +, each with a collar where it meets the handle; the
   handle runs between them and the number rides on it. The plates grow with the load. Reps as a counter: round buttons
   at each end and the count in a ring that fills towards the target; the buttons grow with the count. */
.stepper.dumbbell, .stepper.reps { border: 0; background: none; overflow: visible; grid-template-columns: 34px 1fr 34px; grid-template-rows: auto auto; column-gap: 0; row-gap: 2px; align-items: center; min-height: 0; --grow: 1; --fill: 0%; }
.stepper.dumbbell > button, .stepper.reps > button { position: relative; z-index: 1; min-height: 0; padding: 0; line-height: 1; font-weight: 700; border: 0; }
.stepper.dumbbell > button { width: 22px; height: calc(38px * var(--grow)); max-height: 60px; border-radius: 6px; background: var(--ink); color: var(--plane); font-size: 20px; box-shadow: inset 2px 0 0 rgba(255,255,255,.22), inset -2px 0 0 rgba(0,0,0,.28); transition: height .2s ease; }
.stepper.dumbbell > button::after { content: ""; position: absolute; top: 24%; bottom: 24%; width: 7px; background: var(--ink); filter: brightness(1.3); }
.stepper.dumbbell > button:first-child { justify-self: end; margin-right: 7px; }
.stepper.dumbbell > button:first-child::after { right: -7px; border-radius: 0 3px 3px 0; }
.stepper.dumbbell > button:nth-child(3) { justify-self: start; margin-left: 7px; }
.stepper.dumbbell > button:nth-child(3)::after { left: -7px; border-radius: 3px 0 0 3px; }
.stepper.dumbbell > .mid, .stepper.reps > .mid { position: relative; display: flex; align-items: center; justify-content: center; min-height: 48px; }
.stepper.dumbbell > .mid::before { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 6px); height: 12px; background: linear-gradient(180deg, var(--ink-2), var(--muted) 50%, var(--ink-2)); opacity: .75; }
.stepper.dumbbell input, .stepper.reps input { position: relative; z-index: 1; width: 4.2ch; min-width: 52px; max-width: 100%; padding: 3px 6px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--ink-2); font-size: 18px; min-height: 0; line-height: 1.25; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.stepper.dumbbell > .u, .stepper.reps > .u { grid-column: 1 / -1; font-size: 11px; line-height: 1.2; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper.reps { grid-template-columns: 32px 1fr 32px; }
.stepper.reps > button { width: calc(28px * var(--grow)); height: calc(28px * var(--grow)); max-width: 40px; max-height: 40px; justify-self: center; border-radius: 50%; background: var(--panel); color: var(--accent-ink); border: 2px solid var(--accent); font-size: 18px; box-sizing: border-box; transition: width .2s ease, height .2s ease; }

.set.entry { grid-template-columns: 22px 1.15fr 1fr auto; }

.timerbar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--plane); border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--lift); width: min(520px, calc(100vw - 24px)); }

@media (min-width: 641px) { .sheet-back { align-items: center; padding: 20px; } .sheet { border-radius: 22px; max-height: 88vh; } }
.sheet h2 { font-size: 19px; }
.sheet .handle { width: 42px; height: 4px; border-radius: 2px; background: var(--axis); margin: 0 auto 14px; }
@keyframes sheetUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
footer.note { margin-top: 30px; color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.7; }
.steps { padding-left: 20px; color: var(--ink-2); font-size: 14px; } .steps li { margin: 6px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv b { font-weight: 600; }
.daynav { display: flex; align-items: center; gap: 8px; }
.daynav h2 { margin: 0; font-size: 18px; min-width: 150px; text-align: center; }
.exlib .lg-row { grid-template-columns: 1fr auto; }
details.fold { padding: 0; }
details.fold > summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 16px 20px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { margin: 0; }
details.fold > summary .muted { margin-left: auto; }
details.fold > summary::after { content: ""; width: 8px; height: 8px; flex: none; margin-left: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s ease; }
details.fold[open] > summary::after { transform: rotate(-135deg); }
details.fold > .fold-body { padding: 0 20px 18px; }
@media (max-width: 640px) { details.fold > summary { padding: 14px 16px; } details.fold > .fold-body { padding: 0 16px 16px; } }
details.sub { margin-top: 10px; }
details.sub > summary { list-style: none; cursor: pointer; color: var(--accent-ink); font-weight: 600; font-size: 14px; padding: 6px 0; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary::before { content: "+"; display: inline-block; width: 16px; }
details.sub[open] > summary::before { content: "\2212"; }
details.sub > .fold-body { padding-top: 8px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { position: relative; width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid transparent; background: var(--sw); box-shadow: inset 0 0 0 2px var(--panel); cursor: pointer; transition: border-color .15s ease; }
.swatch:hover { border-color: var(--axis); }
.swatch.on { border-color: var(--ink); }
.swatch.custom { background: conic-gradient(#e5484d, #f5a524, #7bc47f, #3b82f6, #a855f7, #e5484d); }
.swatch.custom.on { background: var(--sw); }
.swatch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; min-height: 0; }

/* ------------------------------------------------------------ entrance and motion */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 640px) { .hero .big { font-size: 46px; } .hero { padding: 20px 18px 16px; } .card { padding: 16px; } }
/* iPhone Safari zooms into any field smaller than 16px; keep fields at 16px on phones. */
@media (max-width: 640px) { input[type="number"], input[type="date"], input[type="text"], input[type="search"], input[type="time"], input[type="email"], select, textarea { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#" id="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 9a4 4 0 0 1 8 0"/><circle cx="12" cy="15" r="6"/></svg></span>
      <h1>Fitness tracker</h1>
    </a>
    <span class="spacer"></span>
    <div id="notice"></div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch between light and dark" title="Light or dark">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <nav class="tiles" role="tablist" aria-label="Sections">
    <button class="tile" role="tab" data-tab="today" aria-selected="true">Today</button>
    <button class="tile" role="tab" data-tab="workout" aria-selected="false">Workout <span class="badge" id="navLive" hidden>live</span></button>
    <button class="tile" role="tab" data-tab="plan" aria-selected="false">Plan</button>
    <button class="tile" role="tab" data-tab="food" aria-selected="false">Food</button>
    <button class="tile" role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button class="tile" role="tab" data-tab="history" aria-selected="false">History</button>
    <button class="tile" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>

  <main>
    <section data-panel="today" id="p-today"><div class="empty">Loading</div></section>
    <section data-panel="workout" id="p-workout" hidden></section>
    <section data-panel="plan" id="p-plan" hidden></section>
    <section data-panel="food" id="p-food" hidden></section>
    <section data-panel="progress" id="p-progress" hidden></section>
    <section data-panel="history" id="p-history" hidden></section>
    <section data-panel="settings" id="p-settings" hidden></section>
  </main>

  <footer class="note">
    Everything is stored on this device. Calorie and strength figures are estimates, not medical advice.<br>
    <span id="footBuild"></span>
  </footer>
</div>

<nav class="bottombar" id="bottombar" aria-label="Sections">
  <button data-go="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-go="workout"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Workout<span class="live" hidden></span></button>
  <button data-go="food"><svg viewBox="0 0 24 24"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 2-3 5-3 8h3v10"/></svg>Food</button>
  <button data-go="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button id="moreBtn" data-more="progress history settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</nav>
<template id="moreTpl"><div class="handle"></div><div class="more">
  <button type="button" data-go="progress"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span>Progress<small>Strength, weight, effort and food charts</small></span></button>
  <button type="button" data-go="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span>History<small>Past workouts and food days</small></span></button>
  <button type="button" data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings<small>You, your goal, training, look and backups</small></span></button>
</div></template>

<div class="sheet-back" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="timerbar" id="timerbar" hidden></div>
<div class="tooltip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>

<script src="./engine.js"></script>
<script src="./store.js"></script>
<script src="./local-api.js"></script>
<script src="./app.js"></script>
</body>
</html>
